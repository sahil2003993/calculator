<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Job Board</title>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background-color: #f4f4f4;
    }

    header {
      background-color: #2c3e50;
      color: white;
      padding: 20px;
      text-align: center;
    }

    nav {
      background-color: #34495e;
      display: flex;
      justify-content: center;
    }

    nav a {
      color: white;
      padding: 14px 20px;
      text-decoration: none;
    }

    nav a:hover {
      background-color: #1abc9c;
    }

    .container {
      padding: 20px;
      max-width: 1000px;
      margin: auto;
    }

    .search-box {
      margin-bottom: 20px;
      text-align: center;
    }

    .search-box input {
      padding: 10px;
      width: 60%;
      border: 1px solid #ccc;
      border-radius: 5px;
    }

    .job-listing {
      background: white;
      padding: 20px;
      margin-bottom: 15px;
      border-radius: 5px;
      box-shadow: 0 1px 5px rgba(0,0,0,0.1);
      cursor: pointer;
    }

    .job-listing:hover {
      background: #e9f5f5;
    }

    .popup {
      display: none;
      position: fixed;
      top: 10%;
      left: 50%;
      transform: translate(-50%, 0);
      background: white;
      border: 1px solid #ccc;
      padding: 30px;
      z-index: 999;
      box-shadow: 0 0 10px rgba(0,0,0,0.2);
      width: 80%;
      max-width: 500px;
    }

    .popup h3 {
      margin-top: 0;
    }

    .popup form {
      display: flex;
      flex-direction: column;
    }

    .popup input, .popup textarea {
      margin-bottom: 10px;
      padding: 10px;
    }

    .popup button {
      background-color: #27ae60;
      color: white;
      border: none;
      padding: 10px;
      cursor: pointer;
    }

    .popup button:hover {
      background-color: #1e8449;
    }

    .overlay {
      position: fixed;
      display: none;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background-color: rgba(0,0,0,0.5);
      z-index: 998;
    }

    footer {
      text-align: center;
      padding: 15px;
      background: #2c3e50;
      color: white;
      margin-top: 40px;
    }

    @media (max-width: 600px) {
      .search-box input {
        width: 90%;
      }
    }
  </style>
</head>
<body>

  <header>
    <h1>Simple Job Board</h1>
    <p>Find your dream job</p>
  </header>

  <nav>
    <a href="#">Home</a>
    <a href="#">Jobs</a>
    <a href="#">Contact</a>
  </nav>

  <div class="container">
    <div class="search-box">
      <input type="text" id="search" placeholder="Search jobs by title..." onkeyup="filterJobs()">
    </div>

    <div id="jobList">
      <!-- Job cards will be inserted here by JavaScript -->
    </div>
  </div>

  <!-- Popup -->
  <div class="overlay" id="overlay" onclick="closePopup()"></div>
  <div class="popup" id="popup">
    <h3 id="popupTitle">Job Title</h3>
    <p id="popupDescription">Job description goes here...</p>
    <hr>
    <form onsubmit="submitApplication(event)">
      <input type="text" id="name" placeholder="Your Name" required />
      <input type="email" id="email" placeholder="Your Email" required />
      <textarea id="message" placeholder="Why are you a good fit?" rows="4" required></textarea>
      <button type="submit">Apply Now</button>
    </form>
  </div>

  <footer>
    &copy; 2025 Simple Job Board. All rights reserved.
  </footer>

  <script>
    const jobs = [
      {
        id: 1,
        title: 'Frontend Developer',
        company: 'Tech Solutions Inc.',
        description: 'Build and maintain user interfaces using React.'
      },
      {
        id: 2,
        title: 'Backend Developer',
        company: 'CloudSoft',
        description: 'Develop APIs and backend systems using Node.js.'
      },
      {
        id: 3,
        title: 'UI/UX Designer',
        company: 'Designify',
        description: 'Create user-centered designs and wireframes.'
      }
    ];

    const jobList = document.getElementById('jobList');

    function displayJobs(jobsToDisplay) {
      jobList.innerHTML = '';
      jobsToDisplay.forEach(job => {
        const div = document.createElement('div');
        div.className = 'job-listing';
        div.innerHTML = `
          <h3>${job.title}</h3>
          <p><strong>Company:</strong> ${job.company}</p>
          <p>${job.description.substring(0, 80)}...</p>
        `;
        div.onclick = () => openPopup(job);
        jobList.appendChild(div);
      });
    }

    function filterJobs() {
      const keyword = document.getElementById('search').value.toLowerCase();
      const filtered = jobs.filter(job => job.title.toLowerCase().includes(keyword));
      displayJobs(filtered);
    }

    function openPopup(job) {
      document.getElementById('popupTitle').innerText = job.title;
      document.getElementById('popupDescription').innerText = job.description;
      document.getElementById('popup').style.display = 'block';
      document.getElementById('overlay').style.display = 'block';
    }

    function closePopup() {
      document.getElementById('popup').style.display = 'none';
      document.getElementById('overlay').style.display = 'none';
    }

    function submitApplication(event) {
      event.preventDefault();
      const name = document.getElementById('name').value;
      const email = document.getElementById('email').value;
      const message = document.getElementById('message').value;

      alert(`Thank you, ${name}! Your application has been submitted.`);

      document.getElementById('popup').style.display = 'none';
      document.getElementById('overlay').style.display = 'none';
    }

    // Initial display
    displayJobs(jobs);
  </script>

</body>
</html>
